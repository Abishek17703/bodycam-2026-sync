name: Sync Madison Abundant Life Videos

on:
  workflow_dispatch:

jobs:
  upload_madison:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yt-dlp and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q --upgrade yt-dlp

      - name: Upload Madison School Shooting Videos
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          OWNER_CLIENT_ID: ${{ secrets.OWNER_CLIENT_ID }}
          OWNER_CLIENT_SECRET: ${{ secrets.OWNER_CLIENT_SECRET }}
          OWNER_REFRESH_TOKEN: ${{ secrets.OWNER_BW_REFRESH_TOKEN }}
        run: |
          python3 -u worker_madison_reuters.py
