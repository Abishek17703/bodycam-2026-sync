name: Sync 2026 Bodycam Cases

on:
  workflow_dispatch:

jobs:
  upload_shard:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rclone, ffmpeg, yt-dlp, bgutil PO-Token server, and WARP SOCKS5 proxy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg rclone aria2
          pip install --upgrade yt-dlp bgutil-ytdlp-pot-provider
          sudo docker run --name bgutil-provider -d -p 4416:4416 --init brainicism/bgutil-ytdlp-pot-provider:latest || true
          curl -sL https://github.com/ViRb3/wgcf/releases/download/v2.2.22/wgcf_2.2.22_linux_amd64 -o /tmp/wgcf && chmod +x /tmp/wgcf
          curl -sL https://github.com/pufferffish/wireproxy/releases/download/v1.0.9/wireproxy_linux_amd64.tar.gz | tar -xz -C /tmp && chmod +x /tmp/wireproxy
          mkdir -p /tmp/w0 && cd /tmp/w0 && /tmp/wgcf register --accept-tos && /tmp/wgcf generate && printf "\n[Socks5]\nBindAddress = 127.0.0.1:40020\n" >> wgcf-profile.conf && nohup /tmp/wireproxy -c wgcf-profile.conf >/dev/null 2>&1 &
          sleep 3

      - name: Run Shard Worker with Live Drive Token Refresh
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: "5"
        run: |
          mkdir -p ~/.config/rclone
          # Start background loop that pulls fresh rclone.conf from Drive staging every 10 minutes atomically
          (
            while true; do
              sleep 600
              rclone --config ~/.config/rclone/rclone.conf copyto gdrive2026_staging:rclone_fresh.conf /tmp/rclone_fresh.tmp 2>/dev/null && [ -s /tmp/rclone_fresh.tmp ] && mv -f /tmp/rclone_fresh.tmp ~/.config/rclone/rclone.conf || true
            done
          ) &
          # Initial bootstrap of rclone.conf from secret
          echo "${{ secrets.RCLONE_CONF_B64 }}" | base64 -d > ~/.config/rclone/rclone.conf
          rclone --config ~/.config/rclone/rclone.conf copyto gdrive2026_staging:rclone_fresh.conf /tmp/rclone_fresh.tmp 2>/dev/null && [ -s /tmp/rclone_fresh.tmp ] && mv -f /tmp/rclone_fresh.tmp ~/.config/rclone/rclone.conf || true
          python3 -u worker_gh.py
